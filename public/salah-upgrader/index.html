<style>
:root{--bg:#0C1220;--bg2:#121b2f;--pri:#1F2F4F;--sec:#3E6A8A;--teal:#7FA6A0;--gold:#D9A441;--gold2:#E6B85C;--text:#EEF1F6;--mut:#A9B4C6;--card:rgba(255,255,255,.045);--line:rgba(230,184,92,.18);--sh:0 20px 50px -20px rgba(0,0,0,.7),0 2px 0 rgba(255,255,255,.03) inset}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans Bengali','Inter',system-ui,sans-serif;background:radial-gradient(1200px 700px at 80% -10%,#24406a55,transparent 60%),radial-gradient(900px 600px at -10% 30%,#3E6A8A33,transparent 60%),linear-gradient(180deg,#0C1220,#0f1830 50%,#0C1220);color:var(--text);line-height:1.75;overflow-x:hidden}
body.en{font-family:'Inter','Noto Sans Bengali',system-ui,sans-serif;line-height:1.6}
a{color:var(--gold2);text-decoration:none}
.wrap{max-width:1140px;margin:0 auto;padding:0 22px}
.gold{background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.lvl{background:linear-gradient(90deg,#3E6A8A,#7FA6A0,#D9A441)}
nav{position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);background:rgba(12,18,32,.72);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:66px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-family:Inter;letter-spacing:.2px}
.brand img{width:38px;height:38px;border-radius:10px;box-shadow:0 6px 18px -6px #D9A44166}
.navlinks{display:flex;gap:22px;font-size:.93rem}
.navlinks a{color:var(--mut)}.navlinks a:hover{color:var(--gold2)}
.toggle{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 14px;cursor:pointer;font:600 .85rem Inter}
.toggle b{color:var(--gold2)}
section{padding:90px 0;position:relative}
.eyebrow{display:inline-block;font-size:.85rem;letter-spacing:0;text-transform:uppercase;color:var(--gold2);border:1px solid var(--line);padding:4px 12px;border-radius:999px;background:rgba(217,164,65,.06);margin-bottom:16px}
h1{font-size:clamp(2.1rem,4.6vw,3.5rem);line-height:1.3;font-weight:700}
h2{font-size:clamp(1.6rem,3vw,2.3rem);line-height:1.35;margin-bottom:14px}
.lead{color:var(--mut);font-size:1.08rem;max-width:620px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;border-radius:14px;padding:13px 22px;font:600 1rem inherit;font-family:inherit;transition:.25s}
.btn-gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1408;box-shadow:0 12px 30px -10px #D9A441aa}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 18px 40px -12px #D9A441cc}
.btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--gold)}
.card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.07);border-radius:22px;box-shadow:var(--sh);padding:26px}
.hero{padding:70px 0 90px}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0 18px}
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{font-size:.85rem;color:var(--mut);background:var(--card);border:1px solid rgba(255,255,255,.07);padding:5px 12px;border-radius:999px}
.pill i{color:var(--gold2);font-style:normal;margin-right:4px}
.phone{width:290px;height:590px;margin:0 auto;border-radius:44px;padding:12px;background:linear-gradient(145deg,#2a3a5c,#0b111e);box-shadow:0 50px 90px -30px #000,0 0 0 1px #ffffff14,0 0 80px -20px #D9A44144;position:relative}
.screen{width:100%;height:100%;border-radius:34px;overflow:hidden;position:relative;background:linear-gradient(180deg,#0C1220,#1F2F4F 60%,#3E6A8A)}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:90px;height:22px;background:#05080f;border-radius:20px;z-index:5}
.glow{position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(90px);opacity:.35;z-index:-1}
/* scene */
.scene{position:absolute;inset:0;overflow:hidden}
.sky{position:absolute;inset:0;transition:background 1.2s}
.sun{position:absolute;left:50%;width:90px;height:90px;margin-left:-45px;border-radius:50%;background:radial-gradient(circle,#ffe7a8,#E6B85C 55%,#D9A44100 72%);box-shadow:0 0 70px 20px #E6B85C55;transition:top 6s cubic-bezier(.2,.7,.2,1),opacity 1s}
.mosque{position:absolute;bottom:0;left:0;width:100%;height:auto}
.stars i{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.7;animation:tw 3s infinite}
@keyframes tw{50%{opacity:.15}}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 20px;opacity:0;transform:translateY(16px);transition:.8s;pointer-events:none}
.overlay.show{opacity:1;transform:none;pointer-events:auto}
.ov-time{font-size:.8rem;letter-spacing:.04em;color:var(--gold2);text-transform:uppercase}
.ov-title{font-size:1.5rem;font-weight:700;margin:4px 0 12px}
.ov-msg{font-size:.95rem;color:#dfe5ef;background:rgba(12,18,32,.55);border:1px solid var(--line);border-radius:16px;padding:14px;backdrop-filter:blur(6px);margin-bottom:18px}
.ov-btns{display:flex;flex-direction:column;gap:9px;width:100%}
.ov-btns button{border:0;border-radius:14px;padding:12px;font:600 .95rem inherit;font-family:inherit;cursor:pointer;transition:.2s}
.b1{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1408}
.b2{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.18)!important}
.b3{background:rgba(12,18,32,.55);color:#cfd6e2;border:1px solid rgba(255,255,255,.1)!important}
.ov-btns button:hover{transform:scale(1.02)}
.countdown{position:absolute;top:44px;left:0;right:0;text-align:center;font:600 .78rem Inter;color:#ffffffaa;letter-spacing:.1em}
.ov-close{position:absolute;top:40px;right:16px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;border:0;cursor:pointer;z-index:6}
.work{position:absolute;inset:0;padding:50px 18px 18px;background:linear-gradient(180deg,#e9edf3,#d7dee8);color:#18202E;transition:opacity .6s}
.work .bar{height:10px;border-radius:6px;background:#b7c2d3;margin:10px 0}
.work .tile{height:70px;border-radius:14px;background:#fff;box-shadow:0 6px 16px -8px #0003;margin:12px 0;display:flex;align-items:center;padding:0 14px;font-size:.85rem;color:#3E6A8A}
.toast{position:absolute;bottom:22px;left:16px;right:16px;background:rgba(12,18,32,.92);border:1px solid var(--line);color:#fff;border-radius:14px;padding:10px 14px;font-size:.85rem;opacity:0;transform:translateY(10px);transition:.4s;z-index:7}
.toast.show{opacity:1;transform:none}
.demo-grid{display:grid;grid-template-columns:.95fr 1.05fr;gap:50px;align-items:center}
.steps{display:grid;gap:14px;margin:22px 0}
.step{display:flex;gap:14px;align-items:flex-start}
.step .n{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:700 .95rem Inter;color:#1a1408;background:linear-gradient(135deg,var(--gold2),var(--gold))}
.step p{color:var(--mut);font-size:.95rem}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.ctrl select{background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-family:inherit}
.log{margin-top:14px;font-size:.9rem;color:var(--mut);min-height:26px}
/* dua */
.dua-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
label{font-size:.9rem;color:var(--mut);display:block;margin:12px 0 6px}
input,textarea,select.f{width:100%;background:rgba(12,18,32,.7);color:var(--text);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 14px;font:1rem inherit;font-family:inherit;outline:none;transition:.2s}
input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px #D9A44122}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:.82rem;padding:6px 12px;border-radius:999px;border:1px dashed var(--line);color:var(--mut);cursor:pointer;background:transparent;font-family:inherit}
.chip:hover{color:var(--gold2);border-color:var(--gold)}
.nudge{position:relative;border-radius:22px;padding:26px;background:linear-gradient(160deg,#1F2F4F,#0C1220);border:1px solid var(--line);box-shadow:var(--sh),0 0 60px -30px #D9A441}
.nudge .cat{display:inline-block;font-size:.78rem;color:#1a1408;background:var(--gold2);border-radius:999px;padding:2px 10px;margin-bottom:12px}
.nudge p{font-size:1.08rem}
.priv{margin-top:14px;font-size:.85rem;color:var(--mut)}
/* sleep */
.sleep{background:linear-gradient(180deg,transparent,#070b15 30%,#070b15 70%,transparent)}
.sleep-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.moon{width:100%;max-width:420px;aspect-ratio:1;margin:auto;border-radius:30px;background:radial-gradient(circle at 70% 25%,#ffffff10,transparent 40%),linear-gradient(160deg,#101a30,#05080f);border:1px solid rgba(255,255,255,.06);position:relative;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px}
.moon .m{width:90px;height:90px;border-radius:50%;box-shadow:-22px 10px 0 0 #E6B85C;transform:translateX(14px)}
.wave{display:flex;gap:5px;align-items:center;height:50px}
.wave span{width:5px;border-radius:4px;background:linear-gradient(var(--gold2),var(--sec));height:10px}
.wave.on span{animation:wv 1s ease-in-out infinite}
.wave span:nth-child(2){animation-delay:.1s}.wave span:nth-child(3){animation-delay:.2s}.wave span:nth-child(4){animation-delay:.3s}.wave span:nth-child(5){animation-delay:.4s}.wave span:nth-child(6){animation-delay:.5s}.wave span:nth-child(7){animation-delay:.6s}
@keyframes wv{50%{height:46px}}
ul.ticks{list-style:none;display:grid;gap:10px;margin:18px 0}
ul.ticks li{padding-left:30px;position:relative;color:var(--mut)}
ul.ticks li:before{content:"✓";position:absolute;left:0;top:0;width:20px;height:20px;border-radius:6px;background:#D9A44122;color:var(--gold2);font-size:.75rem;display:grid;place-items:center;margin-top:4px}
/* report */
.rep-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:26px;align-items:stretch}
.donut{width:200px;height:200px;border-radius:50%;margin:10px auto;position:relative}
.donut:after{content:"";position:absolute;inset:26px;border-radius:50%;background:#111a2d;box-shadow:inset 0 4px 20px #0008}
.donut b{position:absolute;inset:0;display:grid;place-items:center;z-index:2;font:700 1.9rem Inter}
.legend{display:grid;gap:8px;margin-top:14px;font-size:.92rem}
.legend span:first-child{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:8px;vertical-align:middle}
.bars{display:grid;gap:14px;margin-top:8px}
.barrow{display:grid;grid-template-columns:70px 1fr 48px;gap:12px;align-items:center;font-size:.92rem}
.track{height:14px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden;display:flex}
.track i{display:block;height:100%;transition:width 1.4s cubic-bezier(.2,.7,.2,1);width:0}
.badge-ex{display:inline-block;font-size:.75rem;padding:3px 10px;border-radius:999px;background:#3E6A8A44;color:#cfe0ee;border:1px solid #3E6A8A;margin-left:8px;vertical-align:middle}
.quote{font-size:1.1rem;padding:18px 22px;border-left:3px solid var(--gold);background:rgba(217,164,65,.06);border-radius:0 14px 14px 0;margin:18px 0}
/* level */
.path{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:36px;position:relative}
.path:before{content:"";position:absolute;top:34px;left:6%;right:6%;height:4px;border-radius:4px;background:linear-gradient(90deg,#3E6A8A,#7FA6A0,#D9A441)}
.node{text-align:center;position:relative;cursor:pointer}
.node .c{width:68px;height:68px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;font:700 1rem inherit;font-family:inherit;background:#111a2d;border:2px solid #3E6A8A;box-shadow:0 10px 24px -10px #000;transition:.3s;position:relative;z-index:2}
.node.on .c{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1408;border-color:#ffe2a0;box-shadow:0 0 30px -4px #D9A441aa}
.node small{color:var(--mut);font-size:.82rem;display:block}
.node b{font-size:.95rem}
.lvl-info{margin-top:26px}
/* why */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px}
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.3rem;background:linear-gradient(135deg,#3E6A8A55,#D9A44133);border:1px solid var(--line);margin-bottom:14px}
.card h3{font-size:1.1rem;margin-bottom:6px}
.card p{color:var(--mut);font-size:.95rem}
/* free */
.free{text-align:center}
.free .big{font-size:clamp(2.4rem,6vw,4.4rem);font-weight:700;line-height:1.2}
.nos{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.nos div{padding:12px 20px;border-radius:14px;background:var(--card);border:1px solid rgba(255,255,255,.08)}
.nos s{color:var(--mut)}
.donate{max-width:760px;margin:0 auto;text-align:center}
.donate .card{padding:34px}
.dtabs{display:inline-flex;background:rgba(0,0,0,.3);border-radius:12px;padding:4px;margin:16px 0}
.dtabs button{border:0;background:transparent;color:var(--mut);padding:8px 18px;border-radius:9px;cursor:pointer;font-family:inherit;font-weight:600}
.dtabs button.on{background:var(--pri);color:var(--text)}
.amts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.amts button{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:12px;padding:10px 18px;cursor:pointer;font-family:inherit}
.amts button.on{border-color:var(--gold);background:#D9A44118}
.small{font-size:.85rem;color:var(--mut)}
/* faq */
details{border:1px solid rgba(255,255,255,.08);background:var(--card);border-radius:16px;padding:18px 22px;margin-bottom:12px;transition:.3s}
details[open]{border-color:var(--line);background:rgba(217,164,65,.04)}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:14px}
summary:after{content:"+";color:var(--gold2);font-size:1.3rem;line-height:1}
details[open] summary:after{content:"–"}
details p{color:var(--mut);margin-top:10px}
.cta{border-radius:30px;padding:56px 40px;background:radial-gradient(600px 300px at 90% 0%,#D9A44133,transparent 60%),linear-gradient(135deg,#1F2F4F,#0C1220 60%,#22344F);border:1px solid var(--line);box-shadow:var(--sh);display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center}
a.play{color:inherit;text-decoration:none}.play{display:inline-flex;align-items:center;gap:12px;background:#05080f;border:1px solid #ffffff22;border-radius:14px;padding:10px 18px;color:#fff;margin-top:18px}
.play small{display:block;font-size:.7rem;color:var(--mut);font-family:Inter}
.wl{display:flex;gap:10px}
.wl input{flex:1}
footer{padding:40px 0;border-top:1px solid var(--line);color:var(--mut);font-size:.9rem}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .8s,transform .8s}
.reveal.in{opacity:1;transform:none}
[data-en]{}
@media(max-width:900px){
.hero .wrap,.demo-grid,.dua-grid,.sleep-grid,.rep-grid,.cta{grid-template-columns:1fr}
.grid3{grid-template-columns:1fr}
.navlinks{display:none}
.path{grid-template-columns:repeat(3,1fr);row-gap:26px}.path:before{display:none}
section{padding:64px 0}
.hero{padding:40px 0 60px}
.wl{flex-direction:column}
.cta{padding:34px 22px}
}

const FAQ=[
["অ্যাপটি কি সত্যিই ফ্রি?","Is it really free?","হ্যাঁ। সব ফিচার সবার জন্য ফ্রি, কোনো বিজ্ঞাপন বা সাবস্ক্রিপশন নেই। খরচ চলে শুধু ঐচ্ছিক দানে।","Yes. Every feature is free for everyone, with no ads or subscriptions. Costs are covered only by optional donations."],
["পূর্ণ-স্ক্রিন রিমাইন্ডার কি আমার কাজ থামিয়ে দেবে?","Will the full-screen reminder stop my work?","না। ✕ বা Back চেপে যেকোনো সময় বের হতে পারবেন, আর যেকোনো বোতাম চাপলেই আগের স্ক্রিনে ফিরে যাবেন। ফোন ব্যবহারের সময় Android সাধারণত এটা ছোট নোটিফিকেশন হিসেবে দেখায়।","No. You can leave anytime with ✕ or Back, and any button returns you to your screen. While you're using the phone, Android usually shows it as a compact notification."],
["“একটু পরে” কতবার চাপা যায়?","How many times can I snooze?","সীমিত সংখ্যক বার (ডিফল্ট ২ বার, সেটিংস থেকে বদলানো যায়)। তারপর ওয়াক্ত শেষ হওয়ার আগে একবার শেষ রিমাইন্ডার আসে।","A limited number (default 2, adjustable). Then one final reminder comes before the prayer time ends."],
["আমার দোয়া-তালিকা কি কেউ দেখতে পাবে?","Can anyone see my dua list?","না। এটা শুধু আপনার ডিভাইসেই এনক্রিপ্টেড অবস্থায় থাকে, কোনো সার্ভারে যায় না।","No. It stays encrypted on your device and is never sent to a server."],
["নামাজের সময় কীভাবে হিসাব হয়?","How are prayer times calculated?","আপনার লোকেশন অনুযায়ী প্রচলিত হিসাব পদ্ধতিতে (যেমন Karachi), সাথে হানাফি বা শাফেয়ি আসর। প্রতিটি ওয়াক্তের সময় নিজে কয়েক মিনিট এগিয়ে-পিছিয়েও নিতে পারবেন।","From your location using standard methods (e.g. Karachi), with Hanafi or Shafi'i Asr, plus per-prayer minute adjustments."],
["বার্তাগুলোর সূত্র কি যাচাই করা?","Are the message sources verified?","প্রকাশের আগে প্রতিটি বার্তা আর সূত্র একজন যোগ্য আলেম যাচাই করবেন। যাচাই না হওয়া কোনো সূত্র অ্যাপে দেখানো হবে না।","Before launch, every message and source will be reviewed by a qualified scholar. Unverified sources will not be shown."],
["কবে পাওয়া যাবে?","When is it available?","এখনই Google Play-তে পাওয়া যাচ্ছে (com.mahmudulhossain.salahupgrader)। Windows ও Mac সংস্করণ তৈরি হচ্ছে।","It is available now on Google Play (com.mahmudulhossain.salahupgrader). Windows and Mac versions are in the works."],
