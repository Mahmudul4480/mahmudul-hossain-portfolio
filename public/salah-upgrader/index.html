<style>
:root{--bg:#0C1220;--bg2:#121b2f;--pri:#1F2F4F;--sec:#3E6A8A;--teal:#7FA6A0;--gold:#D9A441;--gold2:#E6B85C;--text:#EEF1F6;--mut:#A9B4C6;--card:rgba(255,255,255,.045);--line:rgba(230,184,92,.18);--sh:0 20px 50px -20px rgba(0,0,0,.7),0 2px 0 rgba(255,255,255,.03) inset}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans Bengali','Inter',system-ui,sans-serif;background:radial-gradient(1200px 700px at 80% -10%,#24406a55,transparent 60%),radial-gradient(900px 600px at -10% 30%,#3E6A8A33,transparent 60%),linear-gradient(180deg,#0C1220,#0f1830 50%,#0C1220);color:var(--text);line-height:1.75;overflow-x:hidden}
body.en{font-family:'Inter','Noto Sans Bengali',system-ui,sans-serif;line-height:1.6}
a{color:var(--gold2);text-decoration:none}
.wrap{max-width:1140px;margin:0 auto;padding:0 22px}
.gold{background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
nav{position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);background:rgba(12,18,32,.72);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:66px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-family:Inter;letter-spacing:.2px;color:var(--text)}
.brand img{width:38px;height:38px;border-radius:10px;box-shadow:0 6px 18px -6px #D9A44166}
.navlinks{display:flex;gap:22px;font-size:.93rem}
.navlinks a{color:var(--mut)}.navlinks a:hover{color:var(--gold2)}
.toggle{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 14px;cursor:pointer;font:600 .85rem Inter}
.toggle b{color:var(--gold2)}
section{padding:90px 0;position:relative}
.eyebrow{display:inline-block;font-size:.85rem;letter-spacing:0;text-transform:uppercase;color:var(--gold2);border:1px solid var(--line);padding:4px 12px;border-radius:999px;background:rgba(217,164,65,.06);margin-bottom:16px}
h1{font-size:clamp(2.1rem,4.6vw,3.5rem);line-height:1.3;font-weight:700}
h2{font-size:clamp(1.6rem,3vw,2.3rem);line-height:1.35;margin-bottom:14px}
.lead{color:var(--mut);font-size:1.08rem;max-width:620px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;border-radius:14px;padding:13px 22px;font:600 1rem inherit;font-family:inherit;transition:.25s}
.btn-gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1408;box-shadow:0 12px 30px -10px #D9A441aa;position:relative;overflow:hidden}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 18px 40px -12px #D9A441cc}
.btn-gold::before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:mShine 3.5s infinite}
@keyframes mShine{0%,70%{left:-60%}100%{left:130%}}
.btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--gold)}
.card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.07);border-radius:22px;box-shadow:var(--sh);padding:26px}
.hero{padding:70px 0 90px;position:relative;overflow:hidden;isolation:isolate}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0 18px}
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{font-size:.85rem;color:var(--mut);background:var(--card);border:1px solid rgba(255,255,255,.07);padding:5px 12px;border-radius:999px}
.pill i{color:var(--gold2);font-style:normal;margin-right:4px}
.glow{position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(90px);opacity:.35;z-index:-1;pointer-events:none}
.phone{width:270px;border-radius:40px;padding:10px;background:linear-gradient(145deg,#2a3a5c,#0b111e);box-shadow:0 50px 90px -30px #000,0 0 0 1px #ffffff14,0 0 80px -20px #D9A44144;position:relative;animation:mFloat 5.6s ease-in-out infinite}
.phone.lg{width:300px}
.phone.sm{width:220px}
.phone img{display:block;width:100%;height:auto;border-radius:30px;background:#05080f}
.notch{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:86px;height:20px;background:#05080f;border-radius:20px;z-index:5;pointer-events:none;opacity:.85}
@keyframes mFloat{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-10px) rotate(1.2deg)}}
.hero-phones{position:relative;min-height:620px;display:flex;align-items:center;justify-content:center}
.hero-phones .p1{position:relative;z-index:2}
.hero-phones .p2{position:absolute;right:0;top:40px;z-index:1;opacity:.96;transform:rotate(6deg) scale(.92);animation-delay:-2.3s}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;margin-bottom:88px}
.feat:nth-child(even){direction:rtl}.feat:nth-child(even)>*{direction:ltr}
.feat .copy .ticks{list-style:none;display:grid;gap:10px;margin:18px 0 0}
.feat .copy .ticks li{padding-left:30px;position:relative;color:var(--mut)}
.feat .copy .ticks li:before{content:"✓";position:absolute;left:0;top:0;width:20px;height:20px;border-radius:6px;background:#D9A44122;color:var(--gold2);font-size:.75rem;display:grid;place-items:center;margin-top:4px}
.feat-phones{display:flex;gap:18px;justify-content:center;align-items:flex-end;flex-wrap:wrap}
.gallery{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:36px}
.gallery .phone{width:100%;animation:none;transform:none}
.gallery .phone:hover{transform:translateY(-6px);transition:.3s}
.strip{overflow:hidden;margin-top:10px}
.strip-track{display:flex;gap:18px;width:max-content;animation:marquee 48s linear infinite}
@keyframes marquee{to{transform:translateX(-50%)}}
.strip .phone{width:180px;animation:none;flex:none}
.free{text-align:center}
.free .big{font-size:clamp(2.4rem,6vw,4.4rem);font-weight:700;line-height:1.2}
.nos{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.nos div{padding:12px 20px;border-radius:14px;background:var(--card);border:1px solid rgba(255,255,255,.08)}
.nos s{color:var(--mut)}
.pkg{font-family:Inter,monospace;font-size:.82rem;color:var(--mut);margin-top:14px;word-break:break-all}
details{border:1px solid rgba(255,255,255,.08);background:var(--card);border-radius:16px;padding:18px 22px;margin-bottom:12px;transition:.3s}
details[open]{border-color:var(--line);background:rgba(217,164,65,.04)}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:14px}
summary:after{content:"+";color:var(--gold2);font-size:1.3rem;line-height:1}
details[open] summary:after{content:"–"}
details p{color:var(--mut);margin-top:10px}
.cta{border-radius:30px;padding:56px 40px;background:radial-gradient(600px 300px at 90% 0%,#D9A44133,transparent 60%),linear-gradient(135deg,#1F2F4F,#0C1220 60%,#22344F);border:1px solid var(--line);box-shadow:var(--sh);display:grid;grid-template-columns:1.2fr auto;gap:30px;align-items:center}
a.play{color:inherit;text-decoration:none}.play{display:inline-flex;align-items:center;gap:12px;background:#05080f;border:1px solid #ffffff22;border-radius:14px;padding:10px 18px;color:#fff}
.play small{display:block;font-size:.7rem;color:var(--mut);font-family:Inter}
footer{padding:40px 0;border-top:1px solid var(--line);color:var(--mut);font-size:.9rem}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .8s,transform .8s}
.reveal.in{opacity:1;transform:none}
@media(max-width:900px){
.hero .wrap,.feat,.cta,.gallery{grid-template-columns:1fr}
.feat:nth-child(even){direction:ltr}
.navlinks{display:none}
section{padding:64px 0}

.hero-phones{min-height:480px}
.hero-phones .p2{right:auto;left:8%;top:auto;bottom:0;transform:rotate(5deg) scale(.78)}
.phone.lg{width:250px}.phone{width:230px}
.gallery{grid-template-columns:repeat(2,1fr)}
.cta{padding:34px 22px;grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.btn-gold::before{display:none}}
</style>
</head>

let L='bn';const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
function apply(){
 document.documentElement.lang=L;document.body.classList.toggle('en',L==='en');
 const i=L==='bn'?0:1;
 $$('[data-t]').forEach(e=>{const v=T[e.dataset.t];if(!v)return;if(e.hasAttribute('data-html'))e.innerHTML=v[i];else e.textContent=v[i]});
 $('#lang').innerHTML=L==='bn'?'<b>বাং</b> / EN':'বাং / <b>EN</b>';
 $('#faqs').innerHTML=FAQ.map(f=>`<details><summary>${f[i]}</summary><p>${f[i+2]}</p></details>`).join('');
 $('#yr').textContent=new Date().getFullYear();
}
$('#lang').onclick=()=>{L=L==='bn'?'en':'bn';apply()};
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1});
$$('.reveal').forEach(r=>io.observe(r));
if(location.hash==='#shot'||navigator.webdriver)$$('.reveal').forEach(r=>r.classList.add('in'));
apply();
</script>
